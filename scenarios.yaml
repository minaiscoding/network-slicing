scenarios:

  # ---------------------------------------------------------------------------

  - name: sparse_iot

    n_prbs: 100

    slices:

      embb:
        count: 1
        cbr:
          lambda: 0.05
          t_mean: 80.0
          bit_rate: 15000000
          packet_size: 1500
        vbr:
          lambda: 0.1
          t_mean: 80.0
          p_size: 1000
          b_size: 1500
          b_rate: 0.01
          packet_size: 1000
        sla:
          cbr_th: 40000000.0
          cbr_queue: 200000.0
          cbr_delay: 500.0
          vbr_th: 60000000.0
          vbr_queue: 250000.0
          vbr_delay: 500.0

      mmtc:
        count: 1
        n_devices: 1000
        repetition_set: [2, 4, 8]
        period_set: [100000, 300000, 600000]
        sla:
          delay: 20000.0

      urllc:
        count: 1
        cbr:
          lambda: 0.02
          t_mean: 10.0
          bit_rate: 1000000
          packet_size: 64
        vbr:
          lambda: 0.05
          t_mean: 10.0
          p_size: 64
          b_size: 128
          b_rate: 0.002
          packet_size: 64
        sla:
          cbr_th: 5000000.0
          cbr_queue: 10000.0
          cbr_delay: 5.0
          vbr_th: 5000000.0
          vbr_queue: 15000.0
          vbr_delay: 10.0


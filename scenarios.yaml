scenarios:

  # ---------------------------------------------------------------------------
  - name: low
    n_prbs: 100
    slices:

      embb:
        count: 1
        cbr:
          lambda: 0.2
          t_mean: 40.0
          bit_rate: 1000000
          packet_size: 1500
        vbr:
          lambda: 0.3
          t_mean: 40.0
          p_size: 500
          b_size: 500
          b_rate: 0.01
          packet_size: 500
        sla:
          cbr_th: 10000000.0
          cbr_queue: 100000.0
          cbr_delay: 10.0
          vbr_th: 15000000.0
          vbr_queue: 150000.0
          vbr_delay: 500.0

      mmtc:
        count: 1
        n_devices: 1000
        repetition_set: [2, 4, 8]
        period_set: [20000, 50000, 100000]
        sla:
          delay: 300.0

      urllc:
        count: 1
        cbr:
          lambda: 0.1
          t_mean: 20.0
          bit_rate: 200000
          packet_size: 1500
        vbr:
          lambda: 0.2
